name: ControlFinanzas
options:
  bundleIdPrefix: com.cravapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ControlFinanzas:
    type: application
    platform: iOS
    sources:
      - path: ControlFinanzas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cravapp.controlfinanzas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ControlFinanzas
        CODE_SIGN_STYLE: Automatic
schemes:
  ControlFinanzas:
    build:
      targets:
        ControlFinanzas: all
